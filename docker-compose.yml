# The whole platform (Milestone 10):
#
#   cp .env.example .env            # set MCP_TOKEN_SECRET (32+ characters)
#   docker compose up --build       # postgres, migrate, mcp, api, ui
#   open http://localhost:8501      # UI;  http://localhost:8000/docs  API
#   docker compose --profile observability up --build   # + collector, Tempo, Prometheus, Grafana
#
# Only postgres for local development against the CLI:
#   docker compose up -d postgres
#   DATABASE_URL=postgresql+psycopg://aegisdesk:aegisdesk@localhost:5432/aegisdesk uv run aegisdesk db init
#   VECTOR_STORE=pgvector uv run aegisdesk rag ingest

x-app: &app
  build: .
  image: aegisdesk:local
  env_file:
    - path: .env
      required: false
  environment: &app-env
    AEGIS_ENV: development
    DATABASE_URL: postgresql+psycopg://aegisdesk:aegisdesk@postgres:5432/aegisdesk
    DATA_STORE: postgres
    AUDIT_STORE: postgres
    CHECKPOINT_STORE: postgres
    VECTOR_STORE: pgvector
    MCP_TOKEN_SECRET: ${MCP_TOKEN_SECRET:-}  # required by mcp and api: 32+ characters in .env
    LOG_FORMAT: json
    LOG_LEVEL: INFO
    TELEMETRY_EXPORTER: ${TELEMETRY_EXPORTER:-none}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aegisdesk
      POSTGRES_PASSWORD: aegisdesk  # local development only
      POSTGRES_DB: aegisdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisdesk -d aegisdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: schema migrations, checkpoint tables, seed rows, knowledge-base index.
  migrate:
    <<: *app
    command: ["sh", "-c", "aegisdesk db init && aegisdesk rag ingest"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Read and action MCP servers (Milestone 5). Internal network only: the API is
  # the only client, and delegation tokens are checked on every call.
  mcp:
    <<: *app
    command: ["aegisdesk", "mcp", "serve", "--host", "0.0.0.0", "--port", "8765"]
    expose: ["8765"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    command: ["aegisdesk", "api", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
      TOOL_TRANSPORT: mcp_http
      MCP_READ_URL: http://mcp:8765/read/mcp
      MCP_ACTION_URL: http://mcp:8765/action/mcp
    ports:
      - "8000:8000"
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  ui:
    build:
      context: .
      args:
        GROUPS: "--group ui"
    image: aegisdesk-ui:local
    command: ["streamlit", "run", "apps/ui/streamlit_app.py", "--server.address=0.0.0.0",
              "--server.port=8501", "--server.headless=true"]
    environment:
      AEGIS_API_URL: http://api:8000
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

  # --- Observability (Milestone 8): docker compose --profile observability up -d
  # Then: TELEMETRY_EXPORTER=otlp OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  # Grafana http://localhost:3000 (dashboard "AegisDesk overview"; anonymous viewer).
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"  # OTLP/HTTP from the apps
      - "8889:8889"  # Prometheus scrape endpoint
    depends_on: [tempo]

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [otel-collector]

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer  # local development only
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus, tempo]

volumes:
  postgres-data:
  tempo-data:
