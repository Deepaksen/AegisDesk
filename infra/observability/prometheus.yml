# Prometheus scrapes the metrics the collector exposes (converted from OTLP).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # The API serves /metrics itself (Milestone 10); with TELEMETRY_EXPORTER=otlp it
  # sends only traces to the collector, so nothing is counted twice.
  - job_name: aegisdesk-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
