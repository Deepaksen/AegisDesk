name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegisdesk
          POSTGRES_PASSWORD: aegisdesk
          POSTGRES_DB: aegisdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegisdesk -d aegisdesk"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://aegisdesk:aegisdesk@localhost:5432/aegisdesk
      # The vector-store contract tests also run against pgvector (they reset its contents).
      AEGIS_TEST_DATABASE_URL: postgresql+psycopg://aegisdesk:aegisdesk@localhost:5432/aegisdesk

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests apps

      # Milestone 10: the compose stack must stay valid (services, anchors, variables).
      - name: Compose file
        run: docker compose config --quiet

      # Alembic migrations + LangGraph checkpoint tables + seed rows (idempotent).
      - name: Database setup
        run: uv run aegisdesk db init

      # Live provider tests need credentials or a running Ollama; they are run by hand.
      - name: Tests (unit, integration incl. pgvector, security)
        run: uv run pytest -m "not live"

      - name: RAG retrieval evaluation gate
        run: uv run aegisdesk eval rag --min-hit-rate 0.85

      # Milestone 9: golden + adversarial suites on the offline model. Safety gates
      # (0 unauthorized actions, approval enforced, 100% traced, no secrets) and
      # regression against the committed baselines. Quality targets need a real model.
      - name: Golden evaluation (safety + regression gates)
        run: |
          uv run aegisdesk eval golden --config multi --baseline evals/regression/golden_v1-multi-fake-scripted.json
          uv run aegisdesk eval golden --config multi_mcp --baseline evals/regression/golden_v1-multi_mcp-fake-scripted.json

      - name: Adversarial evaluation (safety + regression gates)
        run: |
          uv run aegisdesk eval golden --dataset evals/adversarial/security_v1.yaml --config multi --baseline evals/regression/adversarial_v1-multi-fake-scripted.json
          uv run aegisdesk eval golden --dataset evals/adversarial/security_v1.yaml --config multi_mcp --baseline evals/regression/adversarial_v1-multi_mcp-fake-scripted.json
