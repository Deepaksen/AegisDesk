[project]
name = "aegisdesk"
version = "0.1.0"
description = "AegisDesk: an enterprise-style agentic AI service desk, built milestone by milestone for learning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3,<2",
    "langchain-anthropic>=0.3,<2",
    "langchain-ollama>=0.3,<2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "mcp>=2.2,<3",
    "pyjwt>=2.8",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "langgraph-checkpoint-postgres>=2.0",
]

[project.scripts]
aegisdesk = "aegisdesk.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisdesk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; tests use obviously fake credentials.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["aegisdesk"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls a real model provider (needs an API key or a running Ollama); skipped by default in CI",
]
