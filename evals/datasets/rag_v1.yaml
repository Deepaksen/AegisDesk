    user: E1001
    question: How do I get software that is not in the Self Service catalogue?
    expected_document_ids: [DOC-SW-001]
    expected_facts: ["manager approval", "5 business days"]
    answerable: true
  - id: rag-009
    category: software
    user: E1005
    question: Am I allowed to install a torrent client?
    expected_document_ids: [DOC-SW-001]
    expected_facts: ["never allowed"]
    answerable: true
  - id: rag-010
    category: access
