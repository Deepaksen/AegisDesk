    expected_document_ids: [DOC-PAM-001]
    expected_facts: ["8 hours"]
    answerable: true
  - id: rag-013
    category: security
    user: E1002
    question: How do I report a phishing email?
    expected_document_ids: [DOC-SEC-001]
    expected_facts: ["Report Phishing"]
    answerable: true
  - id: rag-014
    category: remote
    user: E1001
