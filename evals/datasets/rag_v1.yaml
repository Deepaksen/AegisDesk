# RAG retrieval evaluation dataset.
#
# Each case: who asks (a synthetic employee), the question, which documents
# must be retrieved (expected_document_ids), facts a correct answer contains
# (expected_facts, used by answer-level evaluators), and documents the user
# must never receive (forbidden_document_ids, access control).
# answerable: false means the user has no document that answers it.
# expect_no_evidence: true means retrieval should return nothing usable at all
# (the system must say it has insufficient evidence).
name: rag_retrieval
version: 1
cases:
  - id: rag-001
    category: vpn
    user: E1004
    question: How do I configure VPN on macOS?
    expected_document_ids: [DOC-VPN-001]
    expected_facts: ["vpn.northstar.example", "Self Service", "Privacy & Security"]
    answerable: true
  - id: rag-002
    category: vpn
    user: E1004
    question: My VPN keeps disconnecting every 10 minutes. What should I try?
    expected_document_ids: [DOC-VPN-001]
    expected_facts: ["6.2", "power saving"]
    answerable: true
  - id: rag-003
    category: vpn
    user: E1001
    question: What does GlobalProtect error GP-512 mean?
    expected_document_ids: [DOC-VPN-001]
    expected_facts: ["certificate has expired"]
    answerable: true
  - id: rag-004
    category: password
    user: E1002
    question: How long is my account locked after too many failed sign-in attempts?
    expected_document_ids: [DOC-PWD-001]
    expected_facts: ["5 failed", "15 minutes"]
    answerable: true
  - id: rag-005
    category: password
    user: E1005
    question: What is the minimum password length?
    expected_document_ids: [DOC-PWD-001]
    expected_facts: ["14 characters"]
    answerable: true
  - id: rag-006
    category: it_handbook
    user: E1004
    question: What are the IT service desk opening hours?
