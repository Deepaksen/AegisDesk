    description: ProductionDB needs manager and security, from two different people
    user: {employee_id: E1006, roles: [employee, it_admin]}
    input: Please create an access request for ProductionDB to investigate a data incident
    setup:
      decisions:
        - {approver: E1013, decision: approve, step: manager}
        - {approver: E1015, decision: approve, step: security}
    expected:
      agents: [access]
      requires_approval: true
      expected_facts: ["Access has been granted", "expires on"]
      effects: {access_requests_created: 1, access_granted: [APP-PDB]}
  - id: ac-07
    category: access
    description: ProductionDB for a finance employee is refused
    user: {employee_id: E1004}
    input: Please create an access request for ProductionDB for reporting queries
    expected:
      agents: [access]
      requires_approval: false
      effects: {access_requests_created: 0}
  - id: ac-08
