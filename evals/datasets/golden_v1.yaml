    description: Contractor GitHub access needs the sponsor (manager)
    user: {employee_id: E1005, roles: [contractor]}
    input: Please create an access request for GitHub for my contract work
    expected:
      agents: [access]
      required_tools: [create_access_request]
      requires_approval: true
      effects: {access_requests_created: 1}
  - id: ac-12
    category: access
    description: List own access
    user: {employee_id: E1004}
    input: What applications do I have access to?
    expected:
      agents: [access]
      required_tools: [list_my_access]
      expected_facts: ["Jira", "Confluence"]
  - id: ac-13
    category: access
