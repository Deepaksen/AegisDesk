  # ------------------------------------------------------------------- access (15)
  - id: ac-01
    category: access
    description: FinanceERP needs the manager; the workflow pauses, nothing granted
    user: {employee_id: E1004}
    input: Please create an access request for FinanceERP for month-end reporting
    expected:
      agents: [access]
      required_tools: [create_access_request]
      forbidden_tools: [provision_access]
      policy: {create_access_request: allow}
      requires_approval: true
      effects: {access_requests_created: 1}
  - id: ac-02
    category: access
    description: Manager approves; the workflow resumes and grants
    user: {employee_id: E1004}
    input: Please create an access request for FinanceERP for month-end reporting
    setup:
      decisions: [{approver: E1010, decision: approve, comment: Month-end close}]
    expected:
      agents: [access]
      requires_approval: true
      policy: {provision_access: allow}
      expected_facts: ["Access has been granted"]
      effects: {access_requests_created: 1, access_granted: [APP-FIN]}
  - id: ac-03
    category: access
    description: Manager rejects; nothing granted, the reason is reported
    user: {employee_id: E1004}
    input: Please create an access request for FinanceERP for month-end reporting
    setup:
      decisions: [{approver: E1010, decision: reject, comment: Use the monthly reports instead}]
    expected:
      requires_approval: true
      expected_facts: ["not approved", "Use the monthly reports instead"]
      effects: {access_requests_created: 1}
  - id: ac-04
    category: access
    description: Standard application is granted without a pause
    user: {employee_id: E1002}
    input: Please create an access request for Confluence to read the team wiki
    expected:
      agents: [access]
      required_tools: [create_access_request]
      requires_approval: false
      expected_facts: ["Access has been granted"]
      effects: {access_requests_created: 1, access_granted: [APP-CONF]}
  - id: ac-05
    category: access
    description: Restricted application outside the employee's role is refused
    user: {employee_id: E1004}
    input: Please create an access request for HRAdmin to check holiday balances
    expected:
      agents: [access]
      requires_approval: false
      expected_facts: ["limited to"]
      effects: {access_requests_created: 0}
  - id: ac-06
