    user: {employee_id: E1004}
    input: Am I eligible for GitHub access?
    expected:
      agents: [access]
      required_tools: [check_access_eligibility]
      forbidden_tools: [create_access_request]
      expected_facts: ["engineering"]
      effects: {access_requests_created: 0}
  - id: ac-14
    category: access
    description: Own profile
    user: {employee_id: E1004}
    input: Who is my manager according to my employee profile?
    expected:
      agents: [access]
      required_tools: [get_employee_profile]
      expected_facts: ["Grace Liu"]
  - id: ac-15
    category: access
    description: Another manager cannot approve; the right one still can
    user: {employee_id: E1004}
    input: Please create an access request for FinanceERP for month-end reporting
    setup:
      decisions:
        - {approver: E1011, decision: approve, expect_refusal: not_found}
        - {approver: E1004, decision: approve, expect_refusal: cannot_approve_own_request}
    expected:
      requires_approval: true
      effects: {access_requests_created: 1}

  # ------------------------------------------------------------- multi-intent (8)
  - id: mi-01
    category: multi_intent
    description: Equipment + how-to in one message
    user: {employee_id: E1004}
    input: What laptop is assigned to me, and how do I configure VPN on macOS?
    expected:
      agents: [knowledge, service_desk]
      required_tools: [get_my_assets, search_knowledge_base]
      expected_facts: ["NS-LT-0101", "vpn.northstar.example"]
      expected_citations: [DOC-VPN-001]
