    expected:
      agents: [access]
      requires_approval: true
      effects: {access_requests_created: 1, access_granted: [APP-AH]}
  - id: ac-10
    category: access
    description: A request for the same application is already open
    user: {employee_id: E1012}
    input: Please create an access request for ProductionDB for the migration dry run
    expected:
      agents: [access]
      expected_facts: ["open"]
      effects: {access_requests_created: 0}
  - id: ac-11
