    user: {employee_id: E1004}
    input: >-
      My VPN keeps disconnecting even after the troubleshooting guide, please open a ticket.
      Also create an access request for FinanceERP for month-end reporting.
    expected:
      agents: [access, service_desk]
      required_tools: [create_ticket, create_access_request]
      requires_approval: true
      effects: {tickets_created: 1, access_requests_created: 1}
  - id: mi-03
    category: multi_intent
